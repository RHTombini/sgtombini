name = "sgt-crm-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:5173,https://sgtombini.pages.dev"
IDENTITY_URL = "https://sgt-identity.sgtombini.workers.dev"
AUDIT_URL = "https://sgt-audit.sgtombini.workers.dev"

# Segredos (dashboard do Cloudflare):
# SUPABASE_URL
# SUPABASE_ANON_KEY
# AUDIT_INTERNAL_TOKEN

[observability]
enabled = true

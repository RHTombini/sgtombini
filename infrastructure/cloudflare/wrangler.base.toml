# Referência de configuração base para Workers do SGT.
# Cada worker tem seu próprio wrangler.toml com `name` e `main` específicos.

compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Segredos nunca vão neste arquivo.
# Configurar no dashboard do Cloudflare:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY
#   AUDIT_INTERNAL_TOKEN
#   NOTIFICATIONS_INTERNAL_TOKEN
